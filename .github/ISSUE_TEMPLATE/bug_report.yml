name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands or what you asked the agent. Remove chat IDs, paths and personal data.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: CBM version, Codex Desktop version, OS, Python version
    validations:
      required: true
