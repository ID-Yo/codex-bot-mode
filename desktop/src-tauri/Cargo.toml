[package]
name = "codex-office-desktop"
version = "0.1.6"
description = "Small Windows controller for Codex Office"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tauri = { version = "=2.12.4", features = ["tray-icon"] }
tauri-plugin-dialog = "=2.8.2"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-shell = "=2.5.0"
tauri-plugin-single-instance = "=2.5.3"

[dev-dependencies]
tauri = { version = "=2.12.4", features = ["test"] }
