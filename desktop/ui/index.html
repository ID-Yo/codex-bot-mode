<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Codex Office</title>
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand-mark" aria-hidden="true"><span></span></div>
        <h1>Codex Office</h1>
        <span class="version">v0.1.8</span>
        <span id="status-badge" class="status-badge" data-state="unverified" role="status">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="status-label">Checking</span>
        </span>
      </header>

      <p id="status-detail" class="status-detail">Checking the authenticated local service…</p>

      <section class="actions-panel" aria-label="Office controls">
        <div class="button-row">
          <button id="start" class="button button-primary" type="button">Start</button>
          <button id="stop" class="button button-secondary" type="button">Stop</button>
          <button id="restart" class="button button-secondary" type="button">Restart</button>
          <button id="open-office" class="button button-open" type="button" title="Open http://localhost:24242 in Chrome">
            Open in Chrome <span class="open-icon" aria-hidden="true">↗</span>
          </button>
        </div>
        <div class="recovery-row">
          <button id="cancel-stop" class="button button-cancel" type="button" hidden>Cancel pending stop</button>
          <button id="recover-startup" class="button button-cancel" type="button" hidden>Recheck owned service</button>
          <button id="preserve-startup" class="button button-cancel" type="button" hidden>Leave child running and quit controller…</button>
          <button id="clear-preserved" class="button button-cancel" type="button" hidden>Clear safety lock…</button>
          <button id="quit-preserved" class="button button-cancel" type="button" hidden>Quit controller and keep safety lock…</button>
        </div>
        <p id="action-message" class="action-message" aria-live="polite"></p>
      </section>

      <section class="setup-panel" aria-label="Office project and Codex runtime">
        <div class="setup-row">
          <span class="setup-label">Project</span>
          <span id="project-path" class="path-value">Choose the project that contains your Office profiles.</span>
          <button id="choose-project" class="text-button" type="button">Choose</button>
        </div>
        <div id="codex-row" class="setup-row">
          <span class="setup-label">Codex</span>
          <span id="codex-path" class="path-value">Looking for the installed Codex runtime…</span>
          <button id="choose-codex" class="text-button" type="button">Locate</button>
        </div>
      </section>

      <details id="logs-details" class="logs-panel">
        <summary><span class="logs-title">Recent activity</span><span id="logs-last" class="logs-last"></span></summary>
        <div class="logs-tools"><button id="refresh" class="text-button" type="button">Refresh</button></div>
        <pre id="logs" class="logs" aria-live="polite">No verified service log is available.</pre>
      </details>

      <footer class="footer">
        <span>Closing this window keeps Office running in the tray.</span>
        <button id="quit" class="text-button quit-button" type="button">Quit Office</button>
      </footer>
      <div id="toast" class="toast" role="alert" hidden></div>
    </main>
  </body>
</html>
