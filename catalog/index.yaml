catalog: codex-bot-mode
version: 2
agents:
  - name: manager
    version: 2
    description: Team Manager, the entry point for one team's work in a project.
  - name: developer
    version: 2
    description: Implements small, complete changes within an assigned boundary.
  - name: verifier
    version: 2
    description: Independently checks a delivered artifact against acceptance criteria.
  - name: director
    version: 1
    description: Project Director for projects with two or more teams.
  - name: blank
    version: 1
    description: Empty agent built through an interview, for roles without a template.
  - name: code-reviewer
    version: 1
    description: Reviews pull requests before verification.
  - name: designer
    version: 1
    description: UI and UX design for the product.
  - name: strategist
    version: 1
    description: Positioning, audience and the marketing plan.
  - name: content-writer
    version: 1
    description: Texts, posts and pages from a brief.
  - name: content-reviewer
    version: 1
    description: Checks tone, facts and brand consistency of content.
  - name: lead-researcher
    version: 1
    description: Finds and qualifies potential customers.
  - name: outreach-writer
    version: 1
    description: Drafts outreach messages; never sends.
  - name: pipeline-analyst
    version: 1
    description: Tracks deals and reports on the pipeline.
  - name: business-analyst
    version: 1
    description: Translate business problems into requirements and a traceable business case.
  - name: research-analyst
    version: 1
    description: Answer bounded questions with cited evidence and explicit uncertainty.
  - name: product-manager
    version: 1
    description: "Define product outcomes, priorities and acceptance criteria."
  - name: data-analyst
    version: 1
    description: Turn supplied data into checked findings and clear measurements.
  - name: operations-specialist
    version: 1
    description: Improve repeatable workflows and prepare bounded automation.
  - name: knowledge-writer
    version: 1
    description: Make verified information retrievable and maintainable.
  - name: support-specialist
    version: 1
    description: Prepare source-grounded support triage and reply drafts.
  - name: learning-designer
    version: 1
    description: "Design learning outcomes, lessons and assessments."
  - name: career-advisor
    version: 1
    description: Help people present verified experience and assess opportunities.
  - name: financial-analyst
    version: 1
    description: Prepare traceable business calculations and budget scenarios.
teams:
  - name: development
    version: 3
    description: Manager, Developer, Code Reviewer, Designer and Verifier for software changes.
  - name: marketing
    version: 1
    description: Manager, Strategist, Content Writer and Content Reviewer.
  - name: sales
    version: 1
    description: Manager, Lead Researcher, Outreach Writer and Pipeline Analyst.
  - name: startup
    version: 1
    description: "Opportunity brief, customer hypotheses and validation plan."
  - name: product
    version: 1
    description: "Product brief, priorities, prototype direction and measurement plan."
  - name: research
    version: 1
    description: Cited research brief with uncertainties and decision options.
  - name: content-studio
    version: 1
    description: Reviewed written material and scoped visual briefs.
  - name: operations
    version: 1
    description: "Documented workflow, knowledge and checked local automation."
  - name: customer-support
    version: 1
    description: "Grounded support drafts, help articles and escalation notes."
  - name: learning
    version: 1
    description: "Learning plans, exercises and reviewed assessments."
  - name: career
    version: 1
    description: Truthful CV/application drafts and interview preparation.
  - name: business-reporting
    version: 1
    description: "Reconciled reports, cash-flow scenarios and assumptions."
  - name: starter
    version: 1
    description: Manager and one explicitly selected catalog specialist.
