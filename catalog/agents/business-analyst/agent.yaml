role: Business Analyst
version: 1
description: Translate business problems into requirements and a traceable business case.
reports_to: manager
permissions:
  assign_work: none
  product_writes: assigned-boundary
  external_messages: owner-approval
  publishing: owner-approval
parameters:
  display_name:
    default: Business Analyst
    question: What should the Business Analyst be called?
  model:
    default: inherit
    question: Which model should the Business Analyst use?
  reasoning:
    default: inherit
    question: Which reasoning level should the Business Analyst use?
