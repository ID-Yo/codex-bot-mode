role: Research Analyst
version: 1
description: Answer bounded questions with cited evidence and explicit uncertainty.
reports_to: manager
permissions:
  assign_work: none
  product_writes: assigned-boundary
  external_messages: owner-approval
  publishing: owner-approval
parameters:
  display_name:
    default: Research Analyst
    question: What should the Research Analyst be called?
  model:
    default: inherit
    question: Which model should the Research Analyst use?
  reasoning:
    default: inherit
    question: Which reasoning level should the Research Analyst use?
