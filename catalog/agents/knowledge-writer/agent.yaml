role: Knowledge Writer
version: 1
description: Make verified information retrievable and maintainable.
reports_to: manager
permissions:
  assign_work: none
  product_writes: assigned-boundary
  external_messages: owner-approval
  publishing: owner-approval
parameters:
  display_name:
    default: Knowledge Writer
    question: What should the Knowledge Writer be called?
  model:
    default: inherit
    question: Which model should the Knowledge Writer use?
  reasoning:
    default: inherit
    question: Which reasoning level should the Knowledge Writer use?
